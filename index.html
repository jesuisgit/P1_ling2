<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz LP2 - Preparatório</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Quiz LP2</h1>
        <p>Desenvolvimento Web Java & Servlets</p>
    </header>

    <div id="quiz-box">
        <div id="quiz">
            <h2 id="question">Carregando pergunta...</h2>
            <div id="answers" class="answer-stack"></div>
            <button id="nextBtn" class="hidden">Próxima Pergunta</button>
        </div>
        <div id="result-container" class="hidden">
            <h2 id="score"></h2>
            <button onclick="location.reload()" class="retry-btn">Tentar Novamente</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
